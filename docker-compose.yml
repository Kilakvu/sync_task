
services:
  # Base de Datos PostgreSQL
  postgres:
    # Use PostgreSQL 14 for broad Flyway compatibility
    image: postgres:15-alpine
    container_name: task-processor-db
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: taskuser
      POSTGRES_PASSWORD: taskpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - task-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskuser -d taskdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Aplicación Principal (Spring Boot con Flyway)
  task-processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-processor-app
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: postgresql
      # Indicar al contenedor de aplicación el host de la BD en la red de Docker
      DB_HOST: postgres
    networks:
      - task-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/api/v1/tasks"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: task-processor-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - task-network
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  task-network:
    driver: bridge