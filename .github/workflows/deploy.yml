name: Continuous Deployment

on:
  push:
    branches: [develop]
    tags: ['v*']

permissions:
  contents: read

jobs:
  # Despliegue a Preproducción (push a develop)
  deploy-preprod:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar en preproducción
        run: |
          echo "Desplegando en preproducción: ${{ vars.API_URL }}"
          echo "DB_HOST: ${{ vars.DB_HOST }}"
          # Reemplaza por tu despliegue real, p. ej.:
          # ssh deploy@${{ vars.DEPLOY_HOST }} \
          #   "cd /app && docker compose pull && docker compose up -d"

  # Despliegue a Producción (push de tag v*)
  deploy-prod:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar en producción
        run: |
          echo "Desplegando en producción: ${{ vars.API_URL }}"
          echo "DB_HOST: ${{ vars.DB_HOST }}"
          # Reemplaza por tu despliegue real
