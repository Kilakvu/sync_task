name: Continuous Deployment

on:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  # Despliegue a Preproducción
  deploy-preprod:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar en preproducción
        run: |
          echo "Desplegando en preproducción: ${{ vars.API_URL }}"
          echo "DB_HOST: ${{ vars.DB_HOST }}"
          # Reemplaza por tu despliegue real, p. ej.:
          # ssh deploy@${{ vars.DEPLOY_HOST }} \
          #   "cd /app && docker compose pull && docker compose up -d"

  # Despliegue a Producción
  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Desplegar en producción
        run: |
          echo "Desplegando en producción: ${{ vars.API_URL }}"
          echo "DB_HOST: ${{ vars.DB_HOST }}"
          # Reemplaza por tu despliegue real
