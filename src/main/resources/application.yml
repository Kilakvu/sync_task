spring:
  application:
    name: citas-peluqueria
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # Datasource must be provided by profile-specific config (e.g. application-postgresql.yml)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false
    validateOnMigrate: true

server:
  port: 8081
  servlet:
    context-path: /

# Clave de acceso a la API. Sobrescribe con la env var API_KEY en cada entorno
# (p. ej. preprod/prod en GitHub Environments).
api:
  key: ${API_KEY:dev-key-123}

# Notificaciones: el modo simulated (por defecto) solo registra el recordatorio en el log;
# el modo whatsapp envía plantillas reales por WhatsApp Cloud API.
app:
  notifications:
    mode: ${NOTIFICATIONS_MODE:simulated}
  whatsapp:
    access-token: ${WHATSAPP_ACCESS_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    verify-token: ${WHATSAPP_VERIFY_TOKEN:whatsapp-dev}
    api-url: ${WHATSAPP_API_URL:}
    graph-api-version: ${WHATSAPP_GRAPH_API_VERSION:v21.0}
    template-name: ${WHATSAPP_TEMPLATE_NAME:cita_recordatorio}
    template-language: ${WHATSAPP_TEMPLATE_LANGUAGE:es}

logging:
  level:
    root: INFO
    org.dataki: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false

