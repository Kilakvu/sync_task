spring:
  application:
    name: sync-task-system
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  # Datasource must be provided by profile-specific config (e.g. application-postgresql.yml)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false
    validateOnMigrate: true

server:
  port: 8081
  servlet:
    context-path: /

# Clave de acceso a la API. Sobrescribe con la env var API_KEY en cada entorno
# (p. ej. preprod/prod en GitHub Environments).
api:
  key: ${API_KEY:dev-key-123}

logging:
  level:
    root: INFO
    org.dataki: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: true

