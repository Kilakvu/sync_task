spring:
  application:
    name: citas-peluqueria
  datasource:
    # DB_HOST permite ejecutar la app desde el host (localhost) o desde un contenedor (DB_HOST=postgres)
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/taskdb
    username: taskuser
    password: taskpass123
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baselineOnMigrate: false
    validateOnMigrate: true

server:
  port: 8081
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    org.dataki: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
  api-docs:
    path: /v3/api-docs
  show-actuator: false