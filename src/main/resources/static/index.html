<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Citas de la Peluquería</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 20px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
  }
  h1 { font-size: 22px; font-weight: 600; }
  .badge { font-size: 13px; color: #94a3b8; }
  .actions { display: flex; gap: 10px; }
  button {
    background: #2563eb;
    color: #fff;
    border: none;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #1d4ed8; }
  button.secondary { background: #334155; }
  button.secondary:hover { background: #475569; }
  button.mini { padding: 4px 10px; font-size: 12px; margin-right: 4px; }
  button.attend { background: #16a34a; }
  button.attend:hover { background: #15803d; }
  button.cancel { background: #dc2626; }
  button.cancel:hover { background: #b91c1c; }
  button:disabled { opacity: .5; cursor: not-allowed; }

  form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
  input {
    background: #0f172a;
    border: 1px solid #334155;
    color: #e2e8f0;
    border-radius: 8px;
    padding: 8px 10px;
    font-size: 14px;
    width: 100%;
  }
  input:focus { outline: none; border-color: #2563eb; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .card {
    background: #1e293b;
    border-radius: 12px;
    padding: 14px;
    border-left: 4px solid #64748b;
  }
  .card .count { font-size: 28px; font-weight: 700; }
  .card .label { font-size: 13px; color: #94a3b8; margin-top: 2px; }
  .card.scheduled { border-left-color: #a855f7; }
  .card.pending   { border-left-color: #f59e0b; }
  .card.processing{ border-left-color: #3b82f6; }
  .card.completed { border-left-color: #22c55e; }
  .card.attended  { border-left-color: #14b8a6; }
  .card.cancelled { border-left-color: #ef4444; }
  .card.retry     { border-left-color: #f97316; }
  .card.failed    { border-left-color: #64748b; }

  .panel {
    background: #1e293b;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .panel h2 { font-size: 15px; font-weight: 600; margin-bottom: 10px; color: #cbd5e1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; position: sticky; top: 0; background: #1e293b; }
  tr { transition: background .3s; }
  tr.pulse { background: #1d4ed8; animation: fade 2s ease; }
  @keyframes fade { from { background: #1d4ed8; } to { background: transparent; } }

  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .status.SCHEDULED { background: #a855f722; color: #c084fc; }
  .status.PENDING   { background: #f59e0b22; color: #fbbf24; }
  .status.PROCESSING{ background: #3b82f622; color: #60a5fa; }
  .status.COMPLETED { background: #22c55e22; color: #4ade80; }
  .status.ATTENDED  { background: #14b8a622; color: #2dd4bf; }
  .status.CANCELLED { background: #ef444422; color: #f87171; }
  .status.RETRY     { background: #f9731622; color: #fb923c; }
  .status.FAILED    { background: #64748b22; color: #94a3b8; }

  .priority { font-size: 12px; padding: 2px 8px; border-radius: 6px; background: #334155; }
  .priority.CRITICAL { background: #ef444422; color: #f87171; }
  .priority.HIGH     { background: #f9731622; color: #fb923c; }
  .priority.MEDIUM   { background: #eab30822; color: #facc15; }
  .priority.LOW      { background: #22c55e22; color: #4ade80; }

  .queue { display: flex; gap: 10px; flex-wrap: wrap; }
  .queue-item {
    background: #0f172a;
    border: 1px solid #334155;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
  }
  .error { color: #f87171; padding: 20px; text-align: center; }
  .empty { color: #64748b; text-align: center; padding: 20px; }
  .footer { text-align: center; color: #475569; font-size: 12px; margin-top: 12px; }
</style>
</head>
<body>

<header>
  <div>
    <h1>Citas de la Peluquería</h1>
    <div class="badge">Última actualización: <span id="lastRefresh">-</span></div>
  </div>
  <div class="actions">
    <button class="secondary" onclick="refresh()">Refrescar ahora</button>
  </div>
</header>

<div class="panel">
  <h2>Agendar cita por teléfono</h2>
  <form id="citaForm">
    <input id="fCustomer" placeholder="Cliente" required>
    <input id="fPhone" placeholder="Teléfono" required>
    <input id="fService" placeholder="Servicio (ej. Corte y peinado)" required>
    <input id="fDateTime" type="datetime-local" required>
    <input id="fDuration" type="number" min="5" step="5" value="30" placeholder="Duración (min)">
    <input id="fNotes" placeholder="Notas">
    <button type="submit" id="btnAdd">Agendar cita</button>
  </form>
</div>

<div class="cards" id="cards"></div>

<div class="panel">
  <h2>Citas de hoy</h2>
  <div style="overflow-x:auto;">
    <table>
      <thead>
        <tr>
          <th>Hora</th>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Servicio</th>
          <th>Duración</th>
          <th>Estado</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="citasBody"></tbody>
    </table>
  </div>
</div>

<div class="panel">
  <h2>Cola de recordatorios</h2>
  <div class="queue" id="queue"></div>
</div>

<div class="footer">Polling cada 2s contra /api/v1/citas · /api/v1/citas/hoy · /api/v1/citas/queue/pending</div>

<script>
  const REFRESH_MS = 2000;
  const API_KEY = 'dev-key-123';
  const STATUSES = ['SCHEDULED', 'PENDING', 'PROCESSING', 'COMPLETED', 'ATTENDED', 'CANCELLED', 'RETRY', 'FAILED'];
  const statusLabels = {
    SCHEDULED: 'Programada', PENDING: 'Recordatorio pendiente', PROCESSING: 'Enviando recordatorio',
    COMPLETED: 'Recordatorio enviado', ATTENDED: 'Atendida', CANCELLED: 'Cancelada',
    RETRY: 'Reintento', FAILED: 'Recordatorio fallido'
  };
  let previousCitas = new Map();

  async function fetchJson(url, options) {
    const res = await fetch(url, { headers: { 'X-API-Key': API_KEY, ...(options?.headers || {}) }, ...options });
    if (!res.ok) throw new Error(url + ' -> ' + res.status);
    return res.json();
  }

  function el(id) { return document.getElementById(id); }

  function renderCards(citas) {
    const counts = {};
    STATUSES.forEach(s => counts[s] = 0);
    citas.forEach(c => { if (counts[c.status] !== undefined) counts[c.status]++; });

    el('cards').innerHTML = STATUSES.map(s => `
      <div class="card ${s.toLowerCase()}">
        <div class="count">${counts[s]}</div>
        <div class="label">${statusLabels[s]}</div>
      </div>
    `).join('');
  }

  function renderCitas(citas) {
    const sorted = [...citas].sort((a, b) => (a.scheduledFor || '').localeCompare(b.scheduledFor || ''));
    el('citasBody').innerHTML = sorted.length === 0
      ? '<tr><td colspan="7" class="empty">Sin citas para hoy</td></tr>'
      : sorted.map(c => {
          const prev = previousCitas.get(c.id);
          const pulse = prev && prev.status !== c.status ? ' pulse' : '';
          previousCitas.set(c.id, c);
          const finalState = c.status === 'ATTENDED' || c.status === 'CANCELLED';
          return `
            <tr class="${pulse}">
              <td>${fmtDate(c.scheduledFor)}</td>
              <td><b>${escapeHtml(c.customerName)}</b></td>
              <td>${escapeHtml(c.phone)}</td>
              <td>${escapeHtml(c.service)} <span class="priority ${c.priority}">${c.priority}</span></td>
              <td>${c.durationMinutes} min</td>
              <td><span class="status ${c.status}">${statusLabels[c.status] || c.status}</span></td>
              <td>${finalState ? '-' : `
                <button class="mini attend" onclick="setCitaState('${c.id}', 'atender')">Atender</button>
                <button class="mini cancel" onclick="setCitaState('${c.id}', 'cancelar')">Cancelar</button>`}
              </td>
            </tr>`;
        }).join('');
  }

  function renderQueue(queue) {
    el('queue').innerHTML = queue.length === 0
      ? '<div class="empty">Cola vacía</div>'
      : queue.map(c => `
          <div class="queue-item">
            <b>${escapeHtml(c.customerName)}</b> · ${escapeHtml(c.service)}
            <span class="priority ${c.priority}">${c.priority}</span>
          </div>`).join('');
  }

  async function refresh() {
    try {
      const [all, hoy, queue] = await Promise.all([
        fetchJson('/api/v1/citas'),
        fetchJson('/api/v1/citas/hoy'),
        fetchJson('/api/v1/citas/queue/pending')
      ]);
      renderCards(all);
      renderCitas(hoy);
      renderQueue(queue);
      el('lastRefresh').textContent = new Date().toLocaleTimeString();
    } catch (e) {
      el('cards').innerHTML = `<div class="error">No se pudo conectar con la API: ${escapeHtml(e.message)}</div>`;
    }
  }

  async function setCitaState(id, action) {
    try {
      await fetch(`/api/v1/citas/${id}/${action}`, {
        method: 'PATCH',
        headers: { 'X-API-Key': API_KEY }
      });
      await refresh();
    } catch (e) {
      alert('Error: ' + e.message);
    }
  }

  el('citaForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = el('btnAdd');
    btn.disabled = true;
    const payload = {
      customerName: el('fCustomer').value.trim(),
      phone: el('fPhone').value.trim(),
      service: el('fService').value.trim(),
      scheduledFor: el('fDateTime').value,
      durationMinutes: parseInt(el('fDuration').value || '30', 10),
      notes: el('fNotes').value.trim()
    };
    try {
      await fetchJson('/api/v1/citas', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      e.target.reset();
      el('fDuration').value = '30';
      await refresh();
    } catch (err) {
      alert('Error agendando cita: ' + err.message);
    } finally {
      btn.disabled = false;
    }
  });

  function fmtDate(iso) {
    if (!iso) return '-';
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleString('es-ES');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[c]);
  }

  refresh();
  setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
